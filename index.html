<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본어·영어 단어 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 보라 띠 + 핑크 그라데이션 머리, 알약 탭, 둥근 2열 카드. 한 가지 밝은 테마로 고정. */
:root{
  color-scheme: light;
  --strip:#8b5cf6;
  --pink-a:#c4407c; --pink-b:#ee4a9b;
  --bg:#fdf1f6;
  --surface:#ffffff;
  --mint:#9ed8d4; --mint-deep:#3f9f98; --mint-soft:#eefaf9;
  --grey:#d4d7da; --grey-ink:#7d848b;
  --cream:#ffeeda; --cream-deep:#e58a2b;
  --ink:#1f2630; --ink-soft:#5b6470;
  --bad:#d6336c;
  --radius:24px;
  --shadow:0 6px 18px rgba(196,64,124,.10);
  --font:"Noto Sans KR","Noto Sans JP","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-ja:"Noto Sans JP","Noto Sans KR","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--strip);outline-offset:2px}
.strip{background:var(--strip);color:#fff;text-align:center;font-size:.8rem;font-weight:500;padding:6px 16px}
.hero{background:linear-gradient(100deg,var(--pink-a),var(--pink-b));color:#fff;padding:18px 16px 46px}
.hero-in,.wrap{max-width:560px;margin:0 auto}
.hero-in{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0;font-size:1.3rem;font-weight:900;letter-spacing:-.01em}
.hero-btn{background:rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:.9rem;padding:10px 16px;border-radius:999px;white-space:nowrap}
.wrap{padding:0 16px 48px;margin-top:-30px;display:flex;flex-direction:column;gap:14px}
.pill{background:var(--surface);border-radius:999px;padding:6px;display:flex;gap:6px;box-shadow:var(--shadow)}
.pill button{flex:1;padding:14px 8px;border-radius:999px;font-weight:900;font-size:1.05rem;color:var(--ink-soft)}
.pill button[aria-pressed="true"]{background:linear-gradient(100deg,var(--pink-a),var(--pink-b));color:#fff;box-shadow:0 4px 10px rgba(196,64,124,.3)}
.pill.level button{padding:10px 8px;font-size:.95rem;font-weight:700}
.pill.level button[aria-pressed="true"]{background:var(--mint);color:var(--ink);box-shadow:none}
.panel{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;color:var(--ink-soft);flex:1;min-width:200px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.dot.ok{background:var(--mint)}.dot.retry{background:var(--cream);box-shadow:inset 0 0 0 1px var(--cream-deep)}.dot.new{background:var(--grey)}
.cta{background:linear-gradient(100deg,var(--pink-a),var(--pink-b));color:#fff;font-weight:900;padding:14px 22px;border-radius:999px;font-size:1rem;min-height:50px}
.cta.block{display:block;width:100%}
.ghost{background:var(--surface);box-shadow:inset 0 0 0 2px var(--mint);color:var(--ink);font-weight:700;padding:12px 18px;border-radius:999px;min-height:48px}
.search{display:flex;align-items:center;gap:10px;border:3px solid var(--mint);background:var(--mint-soft);border-radius:14px;padding:0 14px}
.search svg{flex:none;color:var(--mint-deep)}
.search input{flex:1;border:0;background:none;padding:14px 0;min-width:0;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border-radius:var(--radius);background:var(--grey);color:var(--grey-ink)}
.card.ok{background:var(--mint);color:var(--ink)}
.card.retry{background:var(--cream);color:var(--ink)}
.card.open{grid-column:1/-1}
.card-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:14px 12px 14px 16px;min-height:76px}
.card-main{flex:1;min-width:0}
.word{font-weight:900;font-size:1.2rem;line-height:1.9;overflow-wrap:anywhere}
.word.ja{font-family:var(--font-ja)}
.num{font-size:.8rem;font-weight:500;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.sub{font-size:.9rem;overflow-wrap:anywhere}
.pron{font-size:.85rem;opacity:.8}
.chev{flex:none;transition:transform .2s}
.card.open .chev{transform:rotate(180deg)}
.card-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.ex{background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px}
.ex-s{font-weight:500;line-height:2.1;overflow-wrap:anywhere}
.ex-s.ja{font-family:var(--font-ja)}
.ex-t{font-size:.9rem;color:var(--ink-soft)}
ruby rt{font-size:.5em;font-weight:500;letter-spacing:0}
.speak{align-self:flex-start;background:rgba(255,255,255,.8);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:700;min-height:40px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:28px 8px}
/* 퀴즈 */
.q-top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:999px;background:var(--grey);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(100deg,var(--pink-a),var(--pink-b));border-radius:999px}
.q-count{font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.q-quit{font-size:.85rem;color:var(--ink-soft);text-decoration:underline;padding:8px 4px}
.q-word{text-align:center;padding:26px 16px}
.q-word .word{font-size:2.3rem;line-height:2}
.q-word .pron{font-size:1rem}
.q-ask{font-size:.9rem;color:var(--ink-soft)}
.chances{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.85rem;color:var(--ink-soft);margin-top:8px}
.chances i{width:14px;height:14px;border-radius:50%;background:var(--pink-b)}
.chances i.used{background:var(--grey)}
.msg{border-radius:16px;padding:12px 14px;font-weight:700;text-align:center}
.msg.bad{background:#ffe3ec;color:var(--bad)}
.msg.good{background:var(--mint-soft);color:var(--mint-deep);box-shadow:inset 0 0 0 2px var(--mint)}
.msg.half{background:var(--cream);color:#9a5a12}
.hint{background:var(--cream);border-radius:16px;padding:10px 14px;font-size:.95rem}
.hint b{display:block;font-size:.8rem;color:#9a5a12}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--surface);box-shadow:inset 0 0 0 2px var(--mint);border-radius:18px;padding:14px 16px;text-align:left;font-weight:700;min-height:56px;overflow-wrap:anywhere}
.choice:disabled{cursor:default}
.choice.wrong{background:var(--grey);box-shadow:none;color:var(--grey-ink);text-decoration:line-through}
.choice.right{background:var(--mint);box-shadow:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.chev{transition:none}}
/* 결과 */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.score div{border-radius:18px;padding:14px 6px}
.score b{display:block;font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums}
.score span{font-size:.8rem}
.s-ok{background:var(--mint)}.s-half{background:var(--cream)}.s-bad{background:var(--grey)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{background:var(--cream);border-radius:14px;padding:10px 14px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{flex:1;min-width:140px}
/* 설정 */
h2{font-size:1.05rem;margin:0 0 8px;font-weight:900}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field textarea,.field select{border:2px solid var(--mint);border-radius:12px;padding:12px;background:var(--mint-soft);width:100%}
.field textarea{min-height:110px;resize:vertical}
.note{font-size:.85rem;color:var(--ink-soft);margin:0 0 10px}
.note code{background:var(--bg);border-radius:6px;padding:1px 5px;font-size:.85em}
.status{font-size:.9rem;font-weight:700;margin-top:10px;white-space:pre-line}
.status.err{color:var(--bad)}.status.fine{color:var(--mint-deep)}
table.fmt{border-collapse:collapse;font-size:.8rem;width:100%}
.fmt-wrap{overflow-x:auto;margin-bottom:10px}
table.fmt th,table.fmt td{border:1px solid var(--grey);padding:6px 8px;text-align:left;white-space:nowrap}
table.fmt th{background:var(--mint-soft)}
.check{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:12px}
.check input{width:22px;height:22px;accent-color:var(--pink-a)}
.sample-tag{font-size:.8rem;background:var(--cream);color:#9a5a12;border-radius:999px;padding:4px 10px;font-weight:700}
.hero-in{flex-wrap:wrap}
.hero-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);min-height:40px}
.chip b{font-weight:500;opacity:.7;font-size:.8rem}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.pos{display:inline-block;font-size:.72rem;font-weight:700;background:rgba(255,255,255,.7);color:var(--ink);border-radius:999px;padding:1px 8px;margin-right:6px;white-space:nowrap}
.q-word .pos{background:var(--mint-soft);box-shadow:inset 0 0 0 1px var(--mint);margin:6px 0 0}
.conj{background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px}
.conj b{font-size:.8rem;color:var(--ink-soft)}
.conj dl{margin:6px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px}
.conj dt{font-size:.72rem;color:var(--ink-soft)}
.conj dd{margin:0;font-weight:700;line-height:2;font-family:var(--font-ja);overflow-wrap:anywhere}
table.g td,table.g th{line-height:2;font-family:var(--font-ja)}
table.g td{font-weight:700}
.note.ja{line-height:2}
@media (max-width:339px){.grid{grid-template-columns:1fr}}
@media (min-width:800px){.hero-in,.wrap{max-width:760px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

<div class="strip">구글 시트 단어장으로 푸는 뜻 맞히기 퀴즈</div>
<header class="hero"><div class="hero-in">

var RUBY=/([一-鿿々]+)[(（]([ぁ-ゖァ-ヺー]+)[)）]/g;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ruby(s,show){return esc(s).replace(RUBY,function(m,k,r){return show?'<ruby>'+k+'<rt>'+r+'</rt></ruby>':k;});}
function plain(s){return String(s).replace(RUBY,'$1');}
function kana(s){return String(s).replace(RUBY,'$2');}
function key(lang,w){return lang+'|'+plain(w.word);}

function parsePos(t,lang){
  t=String(t||'').replace(/\s/g,'');if(!t)return '';
  if(t.indexOf('숙어')>=0)return 'idiom';
  if(t.indexOf('동사')>=0){if(lang==='en')return 'v';var m=/[123]/.exec(t);return 'v'+(m?m[0]:'1');}
  if(/い|이형용사/.test(t))return 'i';
  if(/な|나형용사/.test(t))return 'na';
  if(t.indexOf('형용사')>=0)return lang==='ja'?'i':'adj';
  if(t.indexOf('부사')>=0)return 'adv';
  if(t.indexOf('명사')>=0&&t.indexOf('대명사')<0)return 'n';
  return 'etc';
}
function posOf(lang,w){return w.pos||POSDICT[lang][plain(w.word)]||'etc';}
function posGroup(p){return p.charAt(0)==='v'?'v':p==='idiom'?'etc':p;}
function posBadge(lang,w){var p=posOf(lang,w);return p==='etc'?'':'<span class="pos">'+POS_LABEL[lang][p]+'</span>';}
function studyList(){var l=words();if(S.pos==='all')return l;return l.filter(function(w){return posGroup(posOf(S.lang,w))===S.pos;});}

var G1={'う':'わいえお','く':'かきけこ','ぐ':'がぎげご','す':'さしせそ','つ':'たちてと','ぬ':'なにねの','ぶ':'ばびべぼ','む':'まみめも','る':'らりれろ'};
var TE={'う':'って','つ':'って','る':'って','ぬ':'んで','む':'んで','ぶ':'んで','く':'いて','ぐ':'いで','す':'して'};
function verbForms(word,pos){
  var s=word.slice(0,-1),k=word.slice(-1);
  if(pos==='v3'){
    var m=/^(.*)来[(（]く[)）]る$/.exec(word);
    if(m||word==='くる'){var p=m?m[1]:'',kk=function(r){return p+(m?'来('+r+')':r);};
      return {nai:kk('こ')+'ない',masu:kk('き')+'ます',dict:kk('く')+'る',mei:kk('こ')+'い',ba:kk('く')+'れば',you:kk('こ')+'よう',te:kk('き')+'て',ta:kk('き')+'た'};}
    if(!/する$/.test(word))return null;
    var b=word.slice(0,-2);
    return {nai:b+'しない',masu:b+'します',dict:b+'する',mei:b+'しろ',ba:b+'すれば',you:b+'しよう',te:b+'して',ta:b+'した'};
  }
  if(pos==='v2'){if(k!=='る')return null;return {nai:s+'ない',masu:s+'ます',dict:word,mei:s+'ろ',ba:s+'れば',you:s+'よう',te:s+'て',ta:s+'た'};}
  var r=G1[k];if(!r)return null;
  var te=/行[(（]い[)）]く$/.test(word)?'って':TE[k];
  return {nai:s+r[0]+'ない',masu:s+r[1]+'ます',dict:word,mei:s+r[2],ba:s+r[2]+'ば',you:s+r[3]+'う',te:s+te,ta:s+te.replace('て','た').replace('で','だ')};
}

  var word=w.word,s,rows;
  if(pos.charAt(0)==='v'){
    var f=verbForms(word,pos);if(!f)return '';
    return conjTable('기본 변형',[['정중형',f.masu],['현재 부정',f.nai],['과거 (た형)',f.ta],['과거 부정',f.nai.replace(/ない$/,'なかった')],['연결형 (て형)',f.te],['명사 수식',f.dict+'人(ひと)']])+

  }
  if(pos==='i'){
    if(!/い$/.test(word))return '';s=word.slice(0,-1);
    rows=[['정중형',word+'です'],['현재 부정',s+'くない'],['과거',s+'かった'],['과거 부정',s+'くなかった'],['부사형',s+'く'],['연결형',s+'くて'],['명사 수식',word+' + 명사'],['과거 수식',s+'かった + 명사']];
  }else if(pos==='na'){
    rows=[['정중형',word+'です'],['현재 부정',word+'じゃない'],['과거',word+'だった'],['과거 부정',word+'じゃなかった'],['부사형',word+'に'],['연결형',word+'で'],['명사 수식',word+'な + 명사'],['과거 수식',word+'だった + 명사']];
  }else return '';

}

  return '<div class="ex"><div class="ex-s '+(lang==='ja'?'ja':'')+'">'+ruby(w.example,lang==='ja'&&show)+'</div>'+
    (withTrans&&w.trans?'<div class="ex-t">'+esc(w.trans)+'</div>':'')+'</div>';
}
function renderTabs(){
  [].forEach.call(document.querySelectorAll('#tab-lang button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang));});
  [].forEach.call(document.querySelectorAll('#tab-level button'),function(b){b.setAttribute('aria-pressed',String(+b.dataset.level===S.level));});
  var quiz=S.view==='quiz';
  document.getElementById('tab-lang').hidden=quiz;document.getElementById('tab-level').hidden=quiz;
  document.getElementById('btn-settings').textContent=S.view==='settings'?'단어 목록으로':'시트 연결·설정';
  document.getElementById('btn-grammar').textContent=S.view==='grammar'?'단어 목록으로':'일본어 문법 표';
  document.getElementById('lv-idiom').hidden=S.lang!=='en';
}
function render(){
  renderTabs();
  if(S.view==='quiz')app.innerHTML=viewQuiz();
  else if(S.view==='result')app.innerHTML=viewResult();
  else if(S.view==='settings')app.innerHTML=viewSettings();
  else if(S.view==='grammar')app.innerHTML=viewGrammar();
  else app.innerHTML=viewList();

}

      h+='<div class="card-body">'+(S.lang==='ja'&&!settings.showReading?'<div class="pron">읽기: '+esc(kana(w.word))+'</div>':'')+

/* ---------- 퀴즈 ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startQuiz(items,all){
  items=shuffle(items);
  if(!all&&settings.count>0)items=items.slice(0,settings.count);
  S.q={lang:S.lang,items:items,i:0,results:[]};
  nextQuestion();S.view='quiz';render();window.scrollTo(0,0);
}
function nextQuestion(){
  var q=S.q,w=q.items[q.i],pool=[],seen={};seen[w.meaning]=1;
  var lv=shuffle(words()),rest=shuffle([].concat.apply([],data[q.lang]));
  lv.concat(rest).forEach(function(x){if(!seen[x.meaning]){seen[x.meaning]=1;pool.push(x.meaning);}});
  q.choices=shuffle([w.meaning].concat(pool.slice(0,3)));
  q.tries=0;q.done=false;q.result=null;q.wrong={};q.cut=null;q.shake=null;
}
function hintPlan(w,lang){
  var p=[];
  if(!settings.showReading&&(lang==='ja'?kana(w.word)!==w.word:w.pron))p.push('reading');
  if(w.example)p.push('example');
  p.push('cut');
  return p;
}
function viewQuiz(){
  var q=S.q,w=q.items[q.i],lang=q.lang,n=q.items.length;
  var hints=hintPlan(w,lang).slice(0,q.done?9:q.tries);
  var showR=settings.showReading||q.done||hints.indexOf('reading')>=0;
  var h='<div class="q-top"><span class="q-count">'+(q.i+1)+' / '+n+'</span><div class="bar"><i style="width:'+Math.round((q.i+(q.done?1:0))/n*100)+'%"></i></div>'+
    '<button type="button" class="q-quit" data-act="quit">그만하기</button></div>';
  h+='<section class="panel q-word"><div class="q-ask">이 단어의 뜻은?</div>'+wordHtml(w,lang,showR)+
    (lang==='en'&&w.pron&&showR?'<div class="pron">['+esc(w.pron)+']</div>':'')+'<div>'+posBadge(lang,w)+'</div>'+
    '<div class="chances" aria-label="다시 맞춰보기 남은 기회 '+Math.max(0,MAX_RETRY-q.tries)+'번">다시 맞춰보기 기회';
  for(var i=0;i<MAX_RETRY;i++)h+='<i class="'+(i<q.tries?'used':'')+'"></i>';
  h+='</div></section><div aria-live="polite">';
  if(q.done){
    h+=q.result==='ok'?'<div class="msg good">정답입니다!</div>':
       q.result==='retry'?'<div class="msg half">다시 도전해서 맞혔어요. 복습 단어에 넣어 둘게요.</div>':
       '<div class="msg bad">기회를 모두 썼어요. 정답은 “'+esc(w.meaning)+'”</div>';
  }else if(q.tries>0){
    h+='<div class="msg bad">틀렸어요. 다시 맞춰보세요. (남은 기회 '+(MAX_RETRY-q.tries+1)+'번)</div>';
  }
  h+='</div>';
  if(!q.done&&hints.indexOf('example')>=0)h+='<div class="hint"><b>힌트: 예문</b><span class="ex-s '+(lang==='ja'?'ja':'')+'" style="display:block">'+ruby(w.example,lang==='ja'&&showR)+'</span></div>';
  h+='<div class="choices">'+q.choices.map(function(c,i){
    var wrong=q.wrong[i]||q.cut===i,right=q.done&&c===w.meaning;
    return '<button type="button" class="choice'+(wrong?' wrong':'')+(right?' right':'')+(q.shake===i?' shake':'')+'" data-choice="'+i+'"'+(wrong||q.done?' disabled':'')+'>'+esc(c)+'</button>';
  }).join('')+'</div>';
  if(q.done){
    h+='<section class="panel" style="display:flex;flex-direction:column;gap:10px">'+(exampleHtml(w,lang,true,true)||'')+
      '<div class="row">'+speakBtn(w.word,'단어 듣기')+(w.example?speakBtn(w.example,'예문 듣기'):'')+'</div>'+
      '<button type="button" class="cta block" data-act="next">'+(q.i+1<n?'다음 문제':'결과 보기')+'</button></section>';
  }
  q.shake=null;
  return h;
}
function pick(i){
  var q=S.q;if(!q||q.done||q.wrong[i]||q.cut===i)return;
  var w=q.items[q.i];
  if(q.choices[i]===w.meaning){q.done=true;q.result=q.tries===0?'ok':'retry';}
  else{
    q.tries++;q.wrong[i]=true;q.shake=i;
    if(q.tries>MAX_RETRY){q.done=true;q.result='fail';}
    else if(hintPlan(w,q.lang).slice(0,q.tries).indexOf('cut')>=0&&q.cut===null){
      for(var j=0;j<q.choices.length;j++){if(q.choices[j]!==w.meaning&&!q.wrong[j]){q.cut=j;break;}}
      var left=q.choices.filter(function(c,j){return !q.wrong[j]&&q.cut!==j;}).length;
      if(left<2)q.cut=null;
    }
  }
  if(q.done){
    q.results.push({w:w,r:q.result});
    progress[key(q.lang,w)]=q.result==='ok'?'ok':'retry';save('vq.progress',progress);
  }
  render();
}
function viewResult(){
  var q=S.q,c={ok:0,retry:0,fail:0};
  q.results.forEach(function(r){c[r.r]++;});
  var rev=q.results.filter(function(r){return r.r!=='ok';});
  var h='<section class="panel"><h2>퀴즈 결과</h2><div class="score">'+
    '<div class="s-ok"><b>'+c.ok+'</b><span>한 번에 정답</span></div>'+
    '<div class="s-half"><b>'+c.retry+'</b><span>다시 도전해 정답</span></div>'+
    '<div class="s-bad"><b>'+c.fail+'</b><span>오답</span></div></div></section>';
  if(rev.length){
    h+='<section class="panel"><h2>복습할 단어 '+rev.length+'개</h2><ul class="review">'+rev.map(function(r){
      return '<li>'+wordHtml(r.w,q.lang,true)+' <span class="sub">'+esc(r.w.meaning)+'</span></li>';}).join('')+'</ul></section>';
  }else if(q.results.length){h+='<div class="msg good">모두 한 번에 맞혔습니다.</div>';}
  h+='<div class="row">'+(rev.length?'<button type="button" class="cta" data-act="again">틀린 단어만 다시 풀기</button>':'')+
    '<button type="button" class="ghost" data-act="list">단어 목록으로</button></div>';
  return h;
}

function parseCSV(text){
  var rows=[],row=[],cell='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch!=='\r')cell+=ch;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function rowsToItems(rows,lang){
  rows=rows.filter(function(r){return r.some(function(c){return String(c).trim();});});
  if(!rows.length)return [];
  var idx=lang==='ja'?{word:0,meaning:1,example:2,trans:3,pron:-1,pos:-1}:{word:0,pron:1,meaning:2,example:3,trans:4,pos:-1};
  var head=rows[0].map(function(c){return String(c).replace(/\s/g,'');});
  if(head.some(function(c){return c.indexOf('단어')>=0;})){
    idx={word:-1,meaning:-1,example:-1,trans:-1,pron:-1,pos:-1};
    head.forEach(function(c,i){
      if(c.indexOf('품사')>=0)idx.pos=i;
      else if(/해석|번역/.test(c))idx.trans=i;
      else if(c.indexOf('예문')>=0)idx.example=i;
      else if(c.indexOf('발음')>=0)idx.pron=i;
      else if(/뜻|의미/.test(c))idx.meaning=i;
      else if(c.indexOf('단어')>=0&&idx.word<0)idx.word=i;
    });
    rows=rows.slice(1);
  }
  function g(r,i){return i>=0&&r[i]!=null?String(r[i]).trim():'';}
  return rows.map(function(r){return W(g(r,idx.word),g(r,idx.meaning),g(r,idx.example),g(r,idx.trans),g(r,idx.pron),parsePos(g(r,idx.pos),lang));})
    .filter(function(w){return w.word&&w.meaning;});
}
function sheetId(url){var m=/\/d\/([\w-]{20,})/.exec(url||'');return m?m[1]:null;}
function fetchSheet(lang,url){
  var id=sheetId(url);
  if(!id)return Promise.reject(new Error('주소에서 시트를 찾지 못했습니다.'));
  return fetch(SHEET_BASE+id+'/gviz/tq?tqx=out:csv&headers=1')
    .then(function(r){if(!r.ok)throw new Error('공유 설정을 확인하세요.');return r.text();})
    .then(function(t){if(/^\s*<|google\.visualization/.test(t))throw new Error('공유 설정을 확인하세요.');return rowsToItems(parseCSV(t),lang);});
}
function doFetch(){
  var jobs=[];
  ['ja','en'].forEach(function(l){settings.sheets[l].forEach(function(u,i){if(u&&u.trim())jobs.push([l,i,u]);});});
  if(!jobs.length){S.status={ok:false,text:'시트 주소를 하나 이상 입력하세요.'};return render();}
  S.status={ok:true,text:'불러오는 중입니다…'};render();
  var lines=[],ok=true,next={ja:data.ja.slice(),en:data.en.slice()},got={ja:false,en:false};
  Promise.all(jobs.map(function(j){
    var label=(j[0]==='ja'?'일본어 ':'영어 ')+LEVELS[j[1]];
    return fetchSheet(j[0],j[2]).then(function(items){
      if(!got[j[0]]&&data.src[j[0]]==='sample'){next[j[0]]=levelsOf(j[0]).map(function(){return [];});}
      if(j[0]==='en'&&j[1]===3)items.forEach(function(w){if(!w.pos)w.pos='idiom';});
      got[j[0]]=true;next[j[0]][j[1]]=items;lines.push(label+': '+items.length+'개');
    },function(e){ok=false;
      lines.push(label+': 불러오지 못했습니다. '+(e&&e.message&&!/fetch|network|load/i.test(e.message)?e.message:'시트 공유가 “링크가 있는 모든 사용자”인지 확인하세요. Claude 안에서 열었다면 외부 연결이 막혀 있습니다.'));});
  })).then(function(){
    ['ja','en'].forEach(function(l){if(got[l]){data[l]=next[l];data.src[l]='sheet';}});
    save('vq.data',data);lines.sort();S.status={ok:ok,text:lines.join('\n')};render();});
}
function doPaste(){
  var el=document.getElementById('in-paste'),t=el?el.value:'';
  var rows=t.split(/\r?\n/).map(function(l){return l.split('\t');});
  var items=rowsToItems(rows,S.lang);
  if(!items.length){S.status={ok:false,text:'단어를 찾지 못했습니다. 단어와 뜻 칸이 포함되도록 복사했는지 확인하세요.'};return render();}
  if(data.src[S.lang]==='sample'){data[S.lang]=levelsOf(S.lang).map(function(){return [];});data.src[S.lang]='paste';}
  data[S.lang]=data[S.lang].slice();data[S.lang][S.level]=items;save('vq.data',data);
  S.status={ok:true,text:(S.lang==='ja'?'일본어':'영어')+' '+LEVELS[S.level]+'에 '+items.length+'개를 넣었습니다.'};render();
}

/* ---------- 이벤트 ---------- */
document.getElementById('tab-lang').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.lang=b.dataset.lang;if(S.lang!=='en'&&S.level>2)S.level=0;S.pos='all';S.open=null;S.query='';if(S.view==='result'||S.view==='grammar')S.view='list';render();});
document.getElementById('tab-level').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.level=+b.dataset.level;S.pos='all';S.open=null;S.query='';if(S.view==='result'||S.view==='grammar')S.view='list';render();});
document.getElementById('btn-grammar').addEventListener('click',function(){if(S.view==='quiz')return;S.view=S.view==='grammar'?'list':'grammar';render();window.scrollTo(0,0);});
document.getElementById('btn-settings').addEventListener('click',function(){S.view=S.view==='settings'?'list':'settings';S.status=null;S.confirmReset=false;render();});
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-speak],[data-open],[data-choice],[data-act],[data-pos]');if(!t)return;
  if(t.dataset.pos!=null){S.pos=t.dataset.pos;S.open=null;return render();}
  if(t.dataset.speak!=null)return speak(t.dataset.speak,S.view==='quiz'?S.q.lang:S.lang);
  if(t.dataset.open!=null){S.open=S.open===t.dataset.open?null:t.dataset.open;return render();}
  if(t.dataset.choice!=null)return pick(+t.dataset.choice);
  var a=t.dataset.act;
  if(a==='start')startQuiz(studyList());
  else if(a==='next'){if(S.q.i+1<S.q.items.length){S.q.i++;nextQuestion();render();window.scrollTo(0,0);}else{S.view='result';render();window.scrollTo(0,0);}}
  else if(a==='quit'){S.view=S.q.results.length?'result':'list';render();}
  else if(a==='again'){S.lang=S.q.lang;startQuiz(S.q.results.filter(function(r){return r.r!=='ok';}).map(function(r){return r.w;}),true);}
  else if(a==='list'){S.view='list';render();}
  else if(a==='fetch')doFetch();
  else if(a==='paste')doPaste();
  else if(a==='sample'){data={ja:SAMPLE.ja,en:SAMPLE.en,src:{ja:'sample',en:'sample'}};save('vq.data',data);S.status={ok:true,text:'샘플 단어로 되돌렸습니다.'};render();}
  else if(a==='reset'){if(S.confirmReset){progress={};save('vq.progress',progress);S.confirmReset=false;S.status={ok:true,text:'학습 기록을 지웠습니다.'};}else S.confirmReset=true;render();}
});
app.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='q-search'){S.query=e.target.value;var list=studyList(),q=S.query.trim().toLowerCase();
    var shown=list.map(function(w,i){return {w:w,i:i};}).filter(function(o){var w=o.w;return !q||(plain(w.word)+' '+kana(w.word)+' '+w.meaning+' '+w.pron).toLowerCase().indexOf(q)>=0;});
    document.getElementById('grid').innerHTML=gridHtml(shown,list.length);}
  else if(id.indexOf('in-s-')===0){var pp=id.split('-');settings.sheets[pp[2]][+pp[3]]=e.target.value;save('vq.settings',settings);}
});
app.addEventListener('change',function(e){
  if(e.target.id==='in-reading'){settings.showReading=e.target.checked;save('vq.settings',settings);}
  else if(e.target.id==='in-count'){settings.count=+e.target.value;save('vq.settings',settings);}
});
render();
if(data.src.ja==='sample'||data.src.en==='sample'||!(data.en[3]&&data.en[3].length))doFetch();
})();
</script>
</body>
</html>
